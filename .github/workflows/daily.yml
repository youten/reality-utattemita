# #REALITY歌ってみたYouTubeリスト 日次収集＋HTML生成
# 毎日22:00 JST に collect.py → build.py を実行し、変化があれば自動commitする。
# 手動実行（workflow_dispatch）では --days / --backfill を指定できる。
# 必要な Secrets: YOUTUBE_API_KEY（YouTube Data API v3 のAPIキー）
# 書き込みには Actions 標準の GITHUB_TOKEN を使う（PATは不要）。
name: daily-collect

on:
  schedule:
    - cron: "0 13 * * *"  # 22:00 JST
  workflow_dispatch:
    inputs:
      days:
        description: "収集する過去日数（backfill の場合は無視）"
        required: false
        default: "14"
      backfill:
        description: "全期間を収集する（新規アーティスト追加時）"
        required: false
        type: boolean
        default: false
      only:
        description: "対象を絞る（artists.csv の id をカンマ区切り。backfill と併用）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect recent videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY が未設定のため収集をスキップします。Secrets に登録すると翌日から自動で収集が始まります。"
            exit 0
          fi
          if [ "${{ inputs.backfill }}" = "true" ]; then
            ARGS="--backfill"
          else
            ARGS="--days ${{ inputs.days || '14' }}"
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          python3 collect.py $ARGS
      - name: Build HTML
        run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/musics.json docs/
          for f in data/review_*.csv; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "daily collect: $(date -u +%Y-%m-%d)"
          git push
